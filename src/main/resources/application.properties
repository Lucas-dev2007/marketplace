spring.application.name=marketplace

# Sobe os bancos do docker-compose junto com a aplicação, mas não derruba ao parar.
spring.docker.compose.lifecycle-management=start-only

# ---------------------------------------------------------------------------
# Segurança e monitoramento
# ---------------------------------------------------------------------------

# O health é público, mas o detalhamento (bancos, disco) só aparece para quem está logado.
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info

# Usuários da API. Sem as senhas no ambiente, valem as senhas de desenvolvimento
# (iguais ao nome do usuário) e o log avisa a cada subida.
market.security.admin.username=${MARKET_API_USER:admin}
market.security.admin.password=${MARKET_API_PASSWORD:}
market.security.cliente.username=${MARKET_CLIENTE_USER:cliente}
market.security.cliente.password=${MARKET_CLIENTE_PASSWORD:}

# Liga/desliga o seed de demonstração (20 produtos e 20 clientes).
market.seed.enabled=${MARKET_SEED_ENABLED:true}

# Teto de itens por página para ninguém pedir a base inteira em uma chamada.
spring.data.rest.max-page-size=100

# Sem isso, a conexão com o banco fica aberta até a resposta terminar de ser escrita,
# segurando conexão do pool sem necessidade (o Spring avisa no log que está ligado).
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Registro de clientes (MySQL 3307)
# ---------------------------------------------------------------------------

registration.datasource.url=${REGISTRATION_DB_URL:jdbc:mysql://localhost:3307/registration}
registration.datasource.username=${REGISTRATION_DB_USERNAME:app}
registration.datasource.password=${REGISTRATION_DB_PASSWORD:app}
registration.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O esquema vem do Flyway (resources/db/registration). O Hibernate só confere se
# as entidades batem com o banco; se alguém mudar uma entidade sem criar a
# migração correspondente, a aplicação não sobe — é melhor falhar cedo do que
# descobrir em produção.
registration.jpa.properties.hibernate.hbm2ddl.auto=${REGISTRATION_DB_DDL:validate}

# ---------------------------------------------------------------------------
# Catálogo de produtos (MySQL 3308)
# ---------------------------------------------------------------------------

catalog.datasource.url=${CATALOG_DB_URL:jdbc:mysql://localhost:3308/catalog}
catalog.datasource.username=${CATALOG_DB_USERNAME:app}
catalog.datasource.password=${CATALOG_DB_PASSWORD:app}
catalog.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O esquema vem do Flyway (resources/db/catalog). Aqui era "create", que apagava
# a tabela de produtos a cada reinício.
catalog.jpa.properties.hibernate.hbm2ddl.auto=${CATALOG_DB_DDL:validate}
